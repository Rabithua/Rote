name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - path: server
          - path: web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: bun install --frozen-lockfile

      - name: Run ESLint
        working-directory: ${{ matrix.path }}
        run: bun run lint

      - name: Build
        if: matrix.path == 'web'
        working-directory: ${{ matrix.path }}
        run: bun run build

      - name: Type check
        working-directory: ${{ matrix.path }}
        run: bun run build

      - name: Verify frontend cache headers
        if: matrix.path == 'web'
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run --rm -d -p 127.0.0.1:38081:80 \
            -v "$PWD/dist:/usr/share/nginx/html:ro" \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine)
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          for attempt in {1..10}; do
            if curl --silent --fail --head http://127.0.0.1:38081/ >/dev/null; then break; fi
            sleep 1
          done
          bun run scripts/verify-cache-policy.ts http://127.0.0.1:38081

  note-sharing:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_USER: rote
          POSTGRES_PASSWORD: sharing_test
          POSTGRES_DB: rote_sharing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRESQL_URL: postgres://rote:sharing_test@127.0.0.1:5432/rote_sharing_test
      NOTE_SHARES_TEST_DATABASE_URL: postgres://rote:sharing_test@127.0.0.1:5432/rote_sharing_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        working-directory: server
      - run: bun run db:migrate:programmatic
        working-directory: server
      - run: bun test noteShares mcp/noteShares.test.ts middleware/recorder.test.ts
        working-directory: server
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run test -- src/features/note-sharing src/components/rote src/components/AppSession.test.tsx
        working-directory: web

  embedding-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        working-directory: server
      - run: bun test embeddings/client.test.ts embeddings/migrationSnapshot.test.ts tests/aiClient.test.ts tests/aiAccess.test.ts
        working-directory: server
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run test -- src/pages/admin/components/EmbeddingConfig.test.tsx src/pages/admin/components/AIIndexingActions.test.tsx
        working-directory: web

  embedding-database:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: pgvector/pgvector:pg17-trixie
            database: rote_embedding_test
            suite: index.integration.test.ts
          - image: postgres:17
            database: legacy_embedding_test
            suite: migration.test.ts
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: rote
          POSTGRES_PASSWORD: embedding_test
          POSTGRES_DB: ${{ matrix.database }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRESQL_URL: postgres://rote:embedding_test@127.0.0.1:5432/${{ matrix.database }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        working-directory: server
      - if: matrix.suite == 'index.integration.test.ts'
        run: bun run db:migrate:programmatic
        working-directory: server
      - run: bun test embeddings/${{ matrix.suite }}
        working-directory: server
      - if: matrix.suite == 'index.integration.test.ts'
        run: bun test embeddings/review.integration.test.ts
        working-directory: server
