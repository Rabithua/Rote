name: Deploy Rote (Backend & Frontend)

on:
  push:
    branches:
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: rote-develop-images-and-compose
  cancel-in-progress: false

jobs:
  build-backend:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve backend release version
        id: backend_release
        shell: bash
        run: |
          description="$(git describe --tags --match 'v[0-9]*' --always --long --dirty)"
          printf 'value=dev-%s\n' "$description" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend Docker image by digest
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/rote-backend,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=rote-backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=rote-backend-${{ matrix.arch }}
          build-args: |
            ROTE_RELEASE_VERSION=${{ steps.backend_release.outputs.value }}

      - name: Export digest and release version
        run: |
          mkdir -p "$RUNNER_TEMP/digests" "$RUNNER_TEMP/backend-meta"
          digest="${{ steps.push.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
          printf '%s' "${{ steps.backend_release.outputs.value }}" > "$RUNNER_TEMP/backend-meta/release-version"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-backend-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload backend metadata
        uses: actions/upload-artifact@v4
        with:
          name: backend-meta-${{ matrix.arch }}
          path: ${{ runner.temp }}/backend-meta/*
          if-no-files-found: error
          retention-days: 1

  merge-backend:
    needs: build-backend
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.release_version.outputs.value }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-backend-*
          merge-multiple: true

      - name: Download backend metadata
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/backend-meta
          pattern: backend-meta-*
          merge-multiple: true

      - name: Read backend release version
        id: release_version
        run: echo "value=$(cat "$RUNNER_TEMP/backend-meta/release-version")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/rote-backend
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:latest-dev" \
            -t "$IMAGE:develop" \
            -t "$IMAGE:develop-${GITHUB_SHA}" \
            $(printf "$IMAGE@sha256:%s " *)

  build-frontend:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend Docker image by digest
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/rote-frontend,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=rote-frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=rote-frontend-${{ matrix.arch }}
          build-args: |
            ROTE_BUILD_REVISION=${{ github.sha }}

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-frontend-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-frontend-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/rote-frontend
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:latest-dev" \
            -t "$IMAGE:develop" \
            -t "$IMAGE:develop-${GITHUB_SHA}" \
            $(printf "$IMAGE@sha256:%s " *)

  deploy-dokploy-compose:
    needs:
      - merge-backend
      - merge-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Trigger Dokploy develop Compose deployment
        env:
          DOKPLOY_COMPOSE_WEBHOOK_URL: ${{ secrets.DOKPLOY_DEVELOP_COMPOSE_WEBHOOK_URL }}
        run: |
          bun -e '
            const rawUrl = Bun.env.DOKPLOY_COMPOSE_WEBHOOK_URL;
            let webhookUrl;
            try {
              webhookUrl = new URL(rawUrl || "");
            } catch {
              console.error("DOKPLOY_DEVELOP_COMPOSE_WEBHOOK_URL is not configured");
              process.exit(1);
            }
            if (webhookUrl.protocol !== "https:") {
              console.error("DOKPLOY_DEVELOP_COMPOSE_WEBHOOK_URL must use HTTPS");
              process.exit(1);
            }
            const sha = Bun.env.GITHUB_SHA || "unknown";
            const response = await fetch(webhookUrl, {
              method: "POST",
              signal: AbortSignal.timeout(20_000),
              headers: {
                "content-type": "application/json",
                "x-github-event": "push",
              },
              body: JSON.stringify({
                head_commit: {
                  id: sha,
                  message: `Deploy develop images ${sha}`,
                },
              }),
            });
            if (!response.ok) {
              console.error(`Dokploy Compose webhook failed with HTTP ${response.status}`);
              process.exit(1);
            }
            console.log("Dokploy develop Compose deployment queued");
          '

      - name: Verify the deployed backend and frontend
        env:
          ROTE_EXPECTED_RELEASE_VERSION: ${{ needs.merge-backend.outputs.release-version }}
          ROTE_EXPECTED_REVISION: ${{ github.sha }}
        run: bun run .github/scripts/verify-deployment.ts
