name: Deploy Rote (Backend & Frontend)

on:
  push:
    branches:
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: rote-develop-images-and-compose
  cancel-in-progress: false

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve backend release version
        id: backend_release
        shell: bash
        run: |
          description="$(git describe --tags --match 'v[0-9]*' --always --long --dirty)"
          printf 'value=dev-%s\n' "$description" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ROTE_RELEASE_VERSION=${{ steps.backend_release.outputs.value }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rote-backend:latest-dev
            ${{ secrets.DOCKERHUB_USERNAME }}/rote-backend:develop
            ${{ secrets.DOCKERHUB_USERNAME }}/rote-backend:develop-${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rote-frontend:latest-dev
            ${{ secrets.DOCKERHUB_USERNAME }}/rote-frontend:develop
            ${{ secrets.DOCKERHUB_USERNAME }}/rote-frontend:develop-${{ github.sha }}

  deploy-dokploy-compose:
    needs:
      - build-backend
      - build-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Trigger Dokploy develop Compose deployment
        env:
          DOKPLOY_COMPOSE_WEBHOOK_URL: ${{ secrets.DOKPLOY_DEVELOP_COMPOSE_WEBHOOK_URL }}
        run: |
          bun -e '
            const rawUrl = Bun.env.DOKPLOY_COMPOSE_WEBHOOK_URL;
            let webhookUrl;
            try {
              webhookUrl = new URL(rawUrl || "");
            } catch {
              console.error("DOKPLOY_DEVELOP_COMPOSE_WEBHOOK_URL is not configured");
              process.exit(1);
            }
            if (webhookUrl.protocol !== "https:") {
              console.error("DOKPLOY_DEVELOP_COMPOSE_WEBHOOK_URL must use HTTPS");
              process.exit(1);
            }
            const sha = Bun.env.GITHUB_SHA || "unknown";
            const response = await fetch(webhookUrl, {
              method: "POST",
              headers: {
                "content-type": "application/json",
                "x-github-event": "push",
              },
              body: JSON.stringify({
                head_commit: {
                  id: sha,
                  message: `Deploy develop images ${sha}`,
                },
              }),
            });
            if (!response.ok) {
              console.error(`Dokploy Compose webhook failed with HTTP ${response.status}`);
              process.exit(1);
            }
            console.log("Dokploy develop Compose deployment queued");
          '
