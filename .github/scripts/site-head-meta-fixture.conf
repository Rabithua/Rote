server {
    listen 3000;
    default_type text/plain;
    charset utf-8;

    location = /v2/api/site/head-meta {
        if ($request_method != GET) { return 405; }
        if ($http_authorization != "") { return 403; }
        if ($http_cookie != "") { return 403; }
        if ($http_referer != "") { return 403; }
        return 200 '<meta name="twitter:creator" content="@rabithua">\n<meta property="og:image" content="https://example.test/card.png">';
    }
}

server {
    listen 3001;

    location = /v2/api/site/head-meta {
        default_type text/plain;
        return 200 '';
    }
}

server {
    listen 3002;

    location = /v2/api/site/head-meta {
        default_type text/plain;
        return 503 '<meta property="og:image" content="https://example.test/card.png">';
    }
}

server {
    listen 3003;

    location = /v2/api/site/head-meta {
        default_type text/html;
        return 200 '<meta property="og:image" content="https://example.test/card.png"><script>UPSTREAM_META_MUST_NOT_APPEAR</script>';
    }
}
