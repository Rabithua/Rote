server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Stable URLs select the current release. Only fingerprinted Vite assets
    # below may be immutable; this also covers HTML and manifest.json.
    add_header Cache-Control "no-store" always;

    location = /healthz {
        access_log off;
        return 204;
    }

    # Never let SPA fallback turn probes for hidden files into false 200s.
    # Keep the standard discovery namespace available for future use.
    location ~ (^|/)\.(?!well-known(?:/|$)) {
        return 404;
    }

    location = /sw.js {
        try_files $uri =404;
    }

    location = /registerSW.js {
        try_files $uri =404;
    }

    # Share bearer paths must not appear in access logs or referrers.
    location /s/ {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;
    gzip_disable "msie6";
}
