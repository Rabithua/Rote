# The fragment is public and identical for every visitor. Cache it only at the
# frontend origin; page HTML still uses no-store.
proxy_cache_path /var/cache/nginx/site-meta keys_zone=rote_site_meta:1m max_size=1m inactive=1m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Stable URLs select the current release. Only fingerprinted Vite assets
    # below may be immutable; this also covers HTML and manifest.json.
    add_header Cache-Control "no-store" always;

    location = /healthz {
        access_log off;
        return 204;
    }

    # Never let SPA fallback turn probes for hidden files into false 200s.
    # Keep the standard discovery namespace available for future use.
    location ~ (^|/)\.(?!well-known(?:/|$)) {
        return 404;
    }

    # Apple's CDN crawler only caches the AASA when it is served as
    # application/json; the extensionless filename would otherwise inherit the
    # default MIME type (octet-stream) and native passkeys would never validate
    # on device.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }

    location = /sw.js {
        try_files $uri =404;
    }

    location = /registerSW.js {
        try_files $uri =404;
    }

    # Share bearer paths must not appear in access logs or referrers.
    location /s/ {
        access_log off;
        error_log /dev/null;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        ssi on;
        ssi_silent_errors on;
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Regular SPA navigations internally redirect here.
    location = /index.html {
        ssi on;
        ssi_silent_errors on;
    }

    # Never let a frontend URL used as the upstream recurse into the SPA.
    location = /v2/api/site/head-meta {
        return 404;
    }

    location = /_rote/site-head-meta {
        internal;
        # A failed subrequest can include the parent share URL in error logs.
        access_log off;
        error_log /dev/null;
        include /etc/nginx/rote-site-meta-upstream.conf;
        if ($rote_meta_api = "") { return 204; }

        proxy_pass $rote_meta_api/v2/api/site/head-meta;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 750ms;
        proxy_send_timeout 750ms;
        proxy_read_timeout 750ms;
        subrequest_output_buffer_size 16k;

        proxy_cache rote_site_meta;
        proxy_cache_key $rote_meta_api;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 750ms;
        proxy_ignore_headers Cache-Control;
        proxy_cache_valid 200 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;
    gzip_disable "msie6";
}
